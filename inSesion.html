<body>
    <div class="cont">
        <h2>Iniciar Sesion</h2>
        <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Correo" required><br>
    <input type="password" id="loginPassword" placeholder="Contraseña" required><br>
    <button type="submit">Ingresar</button>
  </form>

  <div class="cuentas">
        <a href="Registrarse.html" class="btn-menu">¡Crear una cuenta!</a>
      </div>
    </div>

    <script>
    document.getElementById("loginForm").addEventListener("submit", function(e){
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const storedEmail = localStorage.getItem("userEmail");
      const storedPassword = localStorage.getItem("userPassword");

      if(email === storedEmail && password === storedPassword){
        alert("Inicio de sesión exitoso!");
        window.location.href = "biblioteca.html"; // Redirige a otra página
      } else {
        alert("Correo o contraseña incorrectos");
      }
    });
  </script>
