<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decorador 2D</title>
    <link rel="stylesheet" href="../CSS/styleEditor.css">
</head>
<body>
    <h1>🎨 Decorador de Interiores 2D</h1>
    <nav class="barra-superior">
    <button onclick="toggleGrid()">🟦 Activar / Desactivar Cuadrícula</button>
    <button onclick="guardarDiseno()">💾 Guardar Diseño</button>
    <button onclick="cargarDiseno()">📂 Cargar Diseño</button>
    <button onclick="traerAlFrente()">⬆ Traer al Frente</button>
    <button onclick="enviarAlFondo()">⬇ Enviar al Fondo</button>
    </nav>

    <nav class="contenedor">
        
        <!-- Contenedor para el área de diseño (el espacio donde se colocan los muebles) -->
        <div id="espacio" class="espacio">
            <p class="texto">Haz clic en un elemento y colócalo aquí</p>
        </div>

        <!-- Panel de elementos (donde están los botones para crear los muebles) -->
        <div class="panel">
            <h2>Elementos</h2>
            <button onclick="crearElemento('sofa')">Sofá</button>
            <button onclick="crearElemento('cama')">Cama</button>
            <button onclick="crearElemento('mesa')">Mesa</button>
            <button onclick="crearElemento('planta')">Planta</button>
            <button onclick="crearElemento('silla')">Silla</button>
            <button onclick="crearElemento('alfombra')">Alfombra</button>
            <button onclick="crearElemento('reloj')">Reloj</button>
            <button onclick="crearElemento('estante')">Estante</button>
            <button onclick="crearElemento('cuadro')">Cuadro</button>
            <button onclick="crearElemento('cortina')">Cortina</button>
            <button onclick="crearElemento('mesanoche')">Mesa de Noche</button>
            <button onclick="crearElemento('pared')">Pared</button>
            <button onclick="crearElemento('ventana')">Ventana</button>
        </div>

    </nav>

    <script src="../js/2Deditor.js"></script>
</body>
</html>
