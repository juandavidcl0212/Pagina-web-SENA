<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decorador 2D</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../CSS/styleEditor.css">
</head>

<h1>🎨 Decorador de Interiores 2D</h1>

<!-- ================= HEADER ================= -->
<nav class="barra-superior">
  <button id="btnGrid">🟦 Cuadrícula</button>
  <button id="btnGuardar">💾 Guardar</button>
  <button id="btnCargar">📂 Cargar</button>
  <button id="btnFrente">⬆ Frente</button>
  <button id="btnFondo">⬇ Fondo</button>
  <button onclick="exportarPDF()">📄 Exportar PDF</button>
  <button onclick="exportarImagen()">🖼 PNG</button>
</nav>

<!-- ================= CONTENIDO ================= -->
<div class="workspace">

  <!-- PANEL IZQUIERDO -->
  <aside class="panel-lateral">
    <h3>🎭 Temática</h3>

    <select id="tematicaSelect" onchange="mostrarObjetos()">
      <option value="navidad">Navidad</option>
      <option value="halloween">Halloween</option>
      <option value="cumple">Cumpleaños</option>
      <option value="sanvalentin">San Valentín</option>
      <option value="otros">Otros</option>
    </select>

    <h3>🧱 Objetos</h3>
    <div id="listaObjetos"></div>
  </aside>

  <!-- AREA DE DISEÑO -->
  <main id="espacio" class="espacio"></main>

</div>

<!-- JS -->
<script src="../js/2DEditor.js"></script>
</html>
