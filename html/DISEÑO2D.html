<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Diseño</title>
    <link rel="stylesheet" href="../CSS/estilos2D.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
      body { margin: 0; font-family: sans-serif; }
    #toolbar {
      padding: 10px;
      background: #f0f0f0;
      display: flex;
      gap: 10px;
    }
      canvas {
      border: 1px solid #ccc;
      cursor: crosshair;
    }
    </style>
</head>
<header></header>
<body>
<div id="toolbar">
  <button id="btnRect">
        <img src="../assets/square-regular.png" alt="Icono" width="20" height="20">
    </button>
    <button id="btnCirc">
        <img src="../assets/circle-regular.png" alt="Icono" width="20" height="20">
    </button>
  <button id="btnCut">Cortar</button>
  <button id="btnCopy">Copiar</button>
  <button id="btnPaste">Pegar</button>
  <button id="btnDelete">Eliminar</button>
</div>

<canvas id="canvas" width="1000" height="600"></canvas>

    <div id="controles">
      <h2>Modificar dimensiones</h2>
      <label>Ancho (m): <input type="number" id="ancho" value="5"></label>
      <label>Alto (m): <input type="number" id="alto" value="3"></label>
      <button id="btnActualizar">Actualizar</button>
    </div>
  </main>

  <script src="../js/editor2D.js"></script>
</body>
</html>
