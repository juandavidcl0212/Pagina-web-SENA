<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decorador 2D</title>
  <link rel="stylesheet" href="../CSS/styleEditor.css">
</head>
<body>
  <h1>🎨 Decorador de Interiores 2D</h1>

  <!-- Barra superior -->
  <nav class="barra-superior">
    <button onclick="toggleGrid()">🟦 Activar / Desactivar Cuadrícula</button>
    <button onclick="guardarProyecto()">💾 Guardar Diseño</button>
    <button onclick="cargarProyecto()">📂 Cargar Diseño</button>
    <button onclick="traerAlFrente()">⬆ Traer al Frente</button>
    <button onclick="enviarAlFondo()">⬇ Enviar al Fondo</button>
  </nav>

  <!-- Selección de espacio y temática -->
  <div class="selecciones">
    <label for="espacioSelect">Escoge el espacio:</label>
    <select id="espacioSelect">
      <option value="salon">Salón</option>
      <option value="sala">Sala</option>
      <option value="oficina">Oficina</option>
      <option value="comedor">Comedor</option>
    </select>

    <label for="tematicaSelect">Escoge la temática:</label>
    <select id="tematicaSelect" onchange="mostrarObjetos()">
      <option value="navidad">Navideña</option>
      <option value="halloween">Halloween</option>
      <option value="cumple">Cumpleaños</option>
      <option value="sanvalentin">San Valentín</option>
      <option value="otros">Otros</option>
    </select>
  </div>

  <nav class="contenedor">
    <!-- Área de diseño -->
    <div id="espacio" class="espacio">
      <p class="texto">Haz clic en un objeto y colócalo aquí</p>
    </div>

    <!-- Panel de objetos -->
    <div class="panel">
      <h2>Objetos</h2>
      <div id="listaObjetos"></div>
    </div>
  </nav>
</body>
</html>
